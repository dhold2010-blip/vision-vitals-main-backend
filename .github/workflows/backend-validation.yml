name: Backend validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: pytest
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./test_vision_vitals.db
          JWT_SECRET: test-only-jwt-secret-that-is-long-enough-12345
          JWT_REFRESH_SECRET: test-only-refresh-secret-that-is-different-12345
          AI_PROVIDER: mock
          STORAGE_PATH: ./test-storage
          TRUSTED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      - name: Compile Python modules
        run: python -m compileall -q vision_vitals
