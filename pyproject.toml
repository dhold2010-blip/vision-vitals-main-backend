[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-vitals-backend"
version = "0.1.0"
description = "Production-oriented Part 1 backend for Vision Vitals"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI dependency defaults are the framework's documented pattern. The
# remaining compatibility/style findings are pre-existing and are intentionally
# excluded from the gate until a dedicated formatting-only change is scheduled.
ignore = ["B008", "BLE001", "I001", "UP017", "UP037"]
